name: Private old NSIS artifact bridge

on:
  workflow_call:
    inputs:
      release_id:
        description: Explicit owned unpublished draft release ID
        required: true
        type: string
      installer_asset_id:
        description: Explicit retained old installer asset ID
        required: true
        type: string
      identity_asset_id:
        description: Explicit strict identity JSON asset ID
        required: true
        type: string
      target_sha:
        description: Exact existing commit SHA pinned by local transfer
        required: true
        type: string
      transfer_tag:
        description: Exact unique owned hpm-baseline-transfer UUID tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_id:
        description: Explicit owned unpublished draft release ID
        required: true
        type: string
      installer_asset_id:
        description: Explicit retained old installer asset ID
        required: true
        type: string
      identity_asset_id:
        description: Explicit strict identity JSON asset ID
        required: true
        type: string
      target_sha:
        description: Exact existing commit SHA pinned by local transfer
        required: true
        type: string
      transfer_tag:
        description: Exact unique owned hpm-baseline-transfer UUID tag
        required: true
        type: string

permissions: {}

jobs:
  bridge:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write # Draft visibility requires push access; confined to this job.
    steps:
      - name: Require the dispatch commit to equal the transfer target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: pwsh
        run: |
          if ($env:TARGET_SHA -cnotmatch '\A[a-f0-9]{40}\z' -or $env:GITHUB_SHA -cne $env:TARGET_SHA) { throw 'Bridge dispatch and target identity mismatch.' }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Verify private draft and download exactly two immutable files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          INSTALLER_ASSET_ID: ${{ inputs.installer_asset_id }}
          IDENTITY_ASSET_ID: ${{ inputs.identity_asset_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TRANSFER_TAG: ${{ inputs.transfer_tag }}
        run: node scripts/bridge-nsis-baseline.cjs
      - name: Upload only verified installer and identity
        id: baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hpm-old-nsis-e7dc2ec
          path: |
            ${{ runner.temp }}/hpm-baseline-bridge/HTTPS Proxy Manager_0.1.0_x64-setup.exe
            ${{ runner.temp }}/hpm-baseline-bridge/identity.json
          retention-days: 1
          if-no-files-found: error
          overwrite: false
      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.baseline.outputs.artifact-id }}
        shell: pwsh
        run: |
          if ($env:ARTIFACT_ID -cnotmatch '\A[1-9][0-9]{0,15}\z') { throw 'Artifact identity refused.' }
          'Private old baseline artifact ID: ' + $env:ARTIFACT_ID >> $env:GITHUB_STEP_SUMMARY
          'No installer executed; no key, database, runtime or user content uploaded. Draft/tag cleanup is separate.' >> $env:GITHUB_STEP_SUMMARY
