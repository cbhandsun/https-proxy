name: Review branch Windows encrypted lifecycle

on:
  push:
    branches:
      - acceptance/windows-encrypted-lifecycle/**

permissions: {}

jobs:
  resolve:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      baseline_artifact_id: ${{ steps.route.outputs.baseline_artifact_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - id: route
        run: node scripts/resolve-nsis-review-route.cjs encrypted
  encrypted:
    needs: resolve
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows-encrypted-lifecycle.yml
    with:
      baseline_artifact_id: ${{ needs.resolve.outputs.baseline_artifact_id }}
