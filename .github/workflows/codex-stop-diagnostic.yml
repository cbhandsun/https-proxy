name: Independent staged Codex enhanced stop diagnostic

on:
  push:
    branches:
      - acceptance/context-recovery/**
    paths:
      - .github/workflows/codex-stop-diagnostic.yml
      - scripts/diagnose-codex-stop.js
      - scripts/lib/codex-stop-diagnostic*
      - test/codex-stop-diagnostic*.test.js
      - test/fixtures/codex-stop-diagnostic*.ps1
      - scripts/lib/nsis-client-*.js
      - scripts/lib/nsis-client-*.cjs
      - scripts/lib/nsis-client-*.ps1
      - scripts/lib/nsis-installed-client-case.js
      - scripts/lib/nsis-installed-client-matrix-contract.js
      - scripts/lib/nsis-installed-business-reply.js
      - scripts/lib/nsis-installed-daemon-http*.psm1
      - scripts/lib/nsis-runtime-boundary*
      - scripts/lib/nsis-encrypted-contract.js
      - scripts/lib/nsis-installation-parallel.js
      - scripts/lib/nsis-baseline-transfer.js
      - scripts/lib/native-loopback-rpc.js
      - scripts/lib/context-recovery-daemon-*
      - scripts/context-hosted/shared/**
      - scripts/prepare-release-runtime.js
      - scripts/release-proxy-sources.json
      - scripts/prepare-context-recovery-native.js
      - scripts/prepare-evidence-gateway.js
      - lib/release/**
      - lib/proxy/**
      - native/context-recovery-key/**
      - tools/nsis-clients/package.json
      - tools/nsis-clients/package-lock.json
      - plugins/hpm-local-evidence/package.json
      - plugins/hpm-local-evidence/package-lock.json
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: current
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: current
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
      - run: rustup default stable
      - name: Restore original locked dependencies and stage actual runtime
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependency restore failed.' }
          npm ci --prefix plugins/hpm-local-evidence --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic plugin restore failed.' }
          npm ci --prefix tools/nsis-clients --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic fixed client restore failed.' }
          npm run release:prepare
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic runtime staging failed.' }
          node -e "require('./scripts/lib/codex-stop-diagnostic-staging').prepareDiagnosticStaging()"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic runtime identity failed.' }
      - name: Execute original enhanced CLI behind original Jobs and WFP
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/lib/codex-stop-diagnostic-run.psm1 -Force
          Invoke-HpmCodexStopDiagnostic
      - name: Record diagnostic scope only
        if: always()
        run: |
          @(
            'Staged Codex enhanced stop diagnostic status: ${{ job.status }}'
            'No full verify, Tauri build, NSIS installation or installed qualification is granted.'
            'The original installed lifecycle workflow and all of its gates remain unchanged.'
            'No real provider request, daily-instance change, or 24-hour run is performed.'
          ) >> $env:GITHUB_STEP_SUMMARY
