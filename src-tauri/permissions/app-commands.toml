[[permission]]
identifier = "allow-all-app-commands"
description = "Allow executing all custom Rust commands for this app"

[permission.commands]
allow = [
  "apply_app_menu",
  "applyAppMenu",
  "execute_app_shortcut",
  "executeAppShortcut",
  "open_config",
  "openConfig",
  "open_log",
  "openLog",
  "open_cert_dir",
  "openCertDir",
  "launch_codex_login_script",
  "launchCodexLoginScript",
  "select_directory_native",
  "selectDirectoryNative",
  "get_proxy_debug",
  "getProxyDebug",
  "get_cert_status_native",
  "management_fetch_native",
  "reveal_entry_auth_key_native",
  "clear_audit_conversations_native",
  "execute_proxy_command",
  "executeProxyCommand",
  "get_launch_on_login",
  "set_launch_on_login"
]
